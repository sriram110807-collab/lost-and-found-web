# ===================================================================
# Lost & Found Web Application Configuration (Railway & Production Ready)
# ===================================================================

# -------------------------------------------------------------------
# Server Configuration (Railway dynamic PORT binding)
# -------------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=/

# Active Profile: Defaults to 'local' for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# -------------------------------------------------------------------
# Database Configuration (MySQL)
# Supports Railway MySQL service variables:
# MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD,
# as well as DB_URL / DATABASE_URL / MYSQL_URL and generic DB_* variables.
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://${MYSQLHOST:${DB_HOST:${MYSQL_HOST:localhost}}}:${MYSQLPORT:${DB_PORT:${MYSQL_PORT:3306}}}/${MYSQLDATABASE:${DB_NAME:${MYSQL_DATABASE:lost_and_found_db}}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:${DB_USER:${MYSQL_USER:root}}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${DB_PASS:${MYSQL_PASSWORD:}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------------------
# JPA / Hibernate
# 'update' mode preserves existing tables, users, reports, and claims
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# File Upload Configuration
# On Railway: Mount a persistent volume to /app/uploads and set UPLOAD_DIR=/app/uploads
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000
# -------------------------------------------------------------------
# Initial Data Seeding (Enabled by default; skips automatically if data exists)
# Set APP_SEED_DATA=false in production if demo seeding is not desired
# -------------------------------------------------------------------
app.seed-data=${APP_SEED_DATA:true}
