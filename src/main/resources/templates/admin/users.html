<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Users - Admin')}"></head>
<body class="bg-main">

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Global Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-4">
        <div class="container">
            <!-- Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                <div>
                    <div class="small text-muted"><a th:href="@{/admin}">&laquo; Back to Admin Dashboard</a></div>
                    <h1 class="h3 fw-bold mb-0 text-navy">Registered User Accounts</h1>
                </div>
            </div>

            <!-- Table of Users -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light small text-uppercase text-muted">
                            <tr>
                                <th class="ps-4">User</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Joined On</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="rounded-circle text-white d-flex align-items-center justify-content-center fw-bold small"
                                             style="width: 36px; height: 36px; background-color: var(--primary-navy);"
                                             th:text="${#strings.substring(u.fullName, 0, 1).toUpperCase()}">U</div>
                                        <span class="fw-bold text-dark" th:text="${u.fullName}">Full Name</span>
                                    </div>
                                </td>
                                <td th:text="${u.email}">email@domain.com</td>
                                <td th:text="${u.phone != null ? u.phone : 'Not provided'}">+91...</td>
                                <td>
                                    <span th:if="${u.role.name() == 'ROLE_ADMIN'}" class="badge bg-danger">ADMIN</span>
                                    <span th:if="${u.role.name() == 'ROLE_USER'}" class="badge bg-primary bg-opacity-10 text-primary">STUDENT / USER</span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
