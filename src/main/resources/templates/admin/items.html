<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Items - Admin')}"></head>
<body class="bg-main">

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Global Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-4">
        <div class="container">
            <!-- Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                <div>
                    <div class="small text-muted"><a th:href="@{/admin}">&laquo; Back to Admin Dashboard</a></div>
                    <h1 class="h3 fw-bold mb-0 text-navy">Manage All Item Reports</h1>
                </div>
            </div>

            <!-- Filter Toolbar -->
            <div class="card border-0 shadow-sm rounded-4 p-3 mb-4 bg-white">
                <form th:action="@{/admin/items}" method="get" class="row g-2">
                    <div class="col-md-5">
                        <input type="text" name="keyword" th:value="${selectedKeyword}" class="form-control" placeholder="Search by title, location...">
                    </div>
                    <div class="col-md-3">
                        <select name="type" class="form-select">
                            <option value="">All Types</option>
                            <option th:each="t : ${allTypes}" th:value="${t}" th:text="${t}" th:selected="${t == selectedType}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select name="status" class="form-select">
                            <option value="">All Statuses</option>
                            <option th:each="st : ${allStatuses}" th:value="${st}" th:text="${st}" th:selected="${st == selectedStatus}"></option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-teal w-100"><i class="bi bi-search"></i></button>
                    </div>
                </form>
            </div>

            <!-- Table of Items -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                <div class="table-responsive" th:if="${not #lists.isEmpty(items)}">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light small text-uppercase text-muted">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Item Details</th>
                                <th>Type</th>
                                <th>Reporter</th>
                                <th>Date Event</th>
                                <th>Status Action</th>
                                <th class="text-end pe-4">Delete</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${items}">
                                <td class="ps-4 font-monospace" th:text="'#' + ${item.id}">#1</td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <img th:if="${item.imagePath != null}" th:src="@{'/uploads/' + ${item.imagePath}}" class="rounded-2 object-fit-cover" style="width: 40px; height: 40px;" alt="img">
                                        <div>
                                            <a th:href="@{'/items/' + ${item.id}}" class="fw-bold text-dark text-decoration-none" th:text="${item.title}">Title</a>
                                            <div class="text-muted small"><span th:text="${item.category}">Category</span> • <span th:text="${item.location}">Location</span></div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${item.type.name() == 'LOST'}" class="item-badge-lost small">LOST</span>
                                    <span th:if="${item.type.name() == 'FOUND'}" class="item-badge-found small">FOUND</span>
                                </td>
                                <td>
                                    <div class="fw-semibold text-dark small" th:text="${item.user.fullName}">Name</div>
                                    <small class="text-muted" th:text="${item.user.email}">email</small>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(item.dateEvent, 'dd MMM yyyy')}">Date</td>
                                <td>
                                    <form th:action="@{'/admin/items/' + ${item.id} + '/status'}" method="post" class="d-flex align-items-center gap-1">
                                        <select name="status" class="form-select form-select-sm" style="width: 140px;">
                                            <option th:each="st : ${allStatuses}" th:value="${st}" th:text="${st}" th:selected="${st == item.status}"></option>
                                        </select>
                                        <button type="submit" class="btn btn-outline-primary btn-sm" title="Update Status">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </form>
                                </td>
                                <td class="text-end pe-4">
                                    <form th:action="@{'/admin/items/' + ${item.id} + '/delete'}" method="post" onsubmit="return confirm('Permanently remove this item as administrator?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(items)}">
                    <p class="text-muted mb-0">No items match the filter criteria.</p>
                </div>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center mt-4" th:if="${totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/items(page=${currentPage - 1}, keyword=${selectedKeyword}, type=${selectedType}, status=${selectedStatus})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${pageNum == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/admin/items(page=${pageNum}, keyword=${selectedKeyword}, type=${selectedType}, status=${selectedStatus})}" th:text="${pageNum + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/items(page=${currentPage + 1}, keyword=${selectedKeyword}, type=${selectedType}, status=${selectedStatus})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
