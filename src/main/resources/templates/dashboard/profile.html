<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body class="bg-main">

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Global Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                        <div class="p-4 bg-navy text-white d-flex align-items-center gap-3" style="background-color: var(--primary-navy);">
                            <div class="rounded-circle text-white d-flex align-items-center justify-content-center fw-bold fs-3"
                                 style="width: 56px; height: 56px; background-color: var(--accent-teal);"
                                 th:text="${#strings.substring(currentUser.fullName, 0, 1).toUpperCase()}">U</div>
                            <div>
                                <h1 class="h4 fw-bold mb-0 text-white">Profile Management</h1>
                                <small class="text-light opacity-75">Update your personal information and account security.</small>
                            </div>
                        </div>

                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{/profile}" th:object="${profileDto}" method="post">
                                <h6 class="fw-bold text-navy mb-3 pb-2 border-bottom">Personal Details</h6>

                                <!-- Full Name -->
                                <div class="mb-3">
                                    <label class="form-label" for="fullName">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Name is required.</div>
                                </div>

                                <!-- Email (Read Only) -->
                                <div class="mb-3">
                                    <label class="form-label" for="email">Email Address</label>
                                    <input type="email" id="email" th:field="*{email}" class="form-control bg-light" readonly>
                                    <small class="text-muted">Email address cannot be changed directly.</small>
                                </div>

                                <!-- Phone -->
                                <div class="mb-4">
                                    <label class="form-label" for="phone">Phone Number</label>
                                    <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="+91...">
                                    <small class="text-muted">Used for claim verification and handover contact.</small>
                                </div>

                                <h6 class="fw-bold text-navy mb-3 pb-2 border-bottom pt-3">Security &amp; Password (Leave blank to keep unchanged)</h6>

                                <!-- Current Password -->
                                <div class="mb-3">
                                    <label class="form-label" for="currentPassword">Current Password</label>
                                    <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control" placeholder="Required only if changing password">
                                </div>

                                <!-- New Password -->
                                <div class="row g-2 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label" for="newPassword">New Password</label>
                                        <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="At least 6 characters">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
                                        <input type="password" id="confirmNewPassword" th:field="*{confirmNewPassword}" class="form-control" placeholder="Repeat new password">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 border-top pt-4">
                                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Back to Dashboard</a>
                                    <button type="submit" class="btn btn-teal px-4">
                                        <i class="bi bi-save me-1"></i> Save Profile Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
