<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body class="bg-main">

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Global Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-sm-8">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex justify-content-center align-items-center rounded-circle bg-primary bg-opacity-10 text-primary mb-3" style="width: 56px; height: 56px;">
                                <i class="bi bi-person-fill-lock fs-3"></i>
                            </div>
                            <h1 class="h4 fw-bold mb-1">Sign In to SRM Finder</h1>
                            <p class="text-muted small">Access your dashboard, manage reports, and review claims.</p>
                        </div>

                        <!-- Form -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label" for="username">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="username" name="username" class="form-control" placeholder="student@bufinder.com" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label class="form-label mb-0" for="password">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-teal w-100 py-2 mb-3 shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </form>

                        <!-- Demo credentials card -->
                        <div class="card bg-light border-0 rounded-3 p-3 mt-2 text-start small">
                            <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1 text-primary"></i> Demo Login Accounts:</div>
                            <div class="text-muted">
                                <div><strong>Admin:</strong> <code>admin@bufinder.com</code> / <code>Admin@123</code></div>
                                <div><strong>Student:</strong> <code>demo@bufinder.com</code> / <code>User@123</code></div>
                            </div>
                        </div>

                        <div class="text-center mt-4 pt-3 border-top small text-muted">
                            Don't have an account?
                            <a th:href="@{/register}" class="fw-bold text-teal">Create an account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
