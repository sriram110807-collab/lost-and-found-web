<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Item Report')}"></head>
<body>

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Global Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
                        <div class="p-4 bg-primary bg-opacity-10 border-bottom d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="bi bi-pencil-fill fs-4"></i>
                            </div>
                            <div>
                                <h1 class="h4 fw-bold text-primary mb-0">Edit Item Report #<span th:text="${item.id}">1</span></h1>
                                <small class="text-muted">Update details, modify recovery status, or replace photo.</small>
                            </div>
                        </div>

                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{'/items/' + ${item.id} + '/edit'}" th:object="${itemForm}" method="post" enctype="multipart/form-data" novalidate>
                                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                                </div>

                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" th:field="*{existingImagePath}">

                                <!-- Title & Type -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-8">
                                        <label class="form-label" for="itemTitle">Item Title <span class="text-danger">*</span></label>
                                        <input type="text" id="itemTitle" th:field="*{title}" class="form-control" th:errorclass="is-invalid" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title is required.</div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label" for="itemType">Type <span class="text-danger">*</span></label>
                                        <select id="itemType" th:field="*{type}" class="form-select">
                                            <option value="LOST">LOST</option>
                                            <option value="FOUND">FOUND</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Status Selection -->
                                <div class="mb-3">
                                    <label class="form-label" for="statusSelect">Report Status</label>
                                    <select id="statusSelect" th:field="*{status}" class="form-select">
                                        <option th:each="st : ${allStatuses}" th:value="${st}" th:text="${st}"></option>
                                    </select>
                                    <small class="text-muted">Set to RESOLVED once the item is recovered and safely returned.</small>
                                </div>

                                <!-- Category, SubType, Brand -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-4">
                                        <label class="form-label" for="categorySelect">Category <span class="text-danger">*</span></label>
                                        <select id="categorySelect" th:field="*{category}" class="form-select" required>
                                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                                        </select>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label" for="subTypeSelect">Sub-type</label>
                                        <select id="subTypeSelect" th:field="*{subType}" class="form-select" th:attr="data-selected=*{subType}">
                                            <option value="">-- Select Sub-type --</option>
                                            <option th:if="*{subType != null}" th:value="*{subType}" th:text="*{subType}" selected></option>
                                        </select>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label" for="brandSelect">Brand</label>
                                        <select id="brandSelect" th:field="*{brand}" class="form-select" th:attr="data-selected=*{brand}">
                                            <option value="">-- Select Brand --</option>
                                            <option th:if="*{brand != null}" th:value="*{brand}" th:text="*{brand}" selected></option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Color, Date, Location -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-4">
                                        <label class="form-label" for="colorSelect">Color</label>
                                        <select id="colorSelect" th:field="*{color}" class="form-select">
                                            <option value="">-- Select Color --</option>
                                            <option th:each="c : ${colors}" th:value="${c}" th:text="${c}"></option>
                                        </select>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label" for="dateEvent">Date <span class="text-danger">*</span></label>
                                        <input type="date" id="dateEvent" th:field="*{dateEvent}" class="form-control" required>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label" for="location">Location <span class="text-danger">*</span></label>
                                        <input type="text" id="location" th:field="*{location}" class="form-control" required>
                                    </div>
                                </div>

                                <!-- Description -->
                                <div class="mb-3">
                                    <label class="form-label" for="description">Description</label>
                                    <textarea id="description" th:field="*{description}" rows="3" class="form-control"></textarea>
                                </div>

                                <!-- Distinguishing Secret Details -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark" for="identifyingDetails">
                                        Confidential Verification Proof Details (Hidden from Public)
                                    </label>
                                    <textarea id="identifyingDetails" th:field="*{identifyingDetails}" rows="2" class="form-control"></textarea>
                                </div>

                                <!-- Image Upload -->
                                <div class="mb-4">
                                    <label class="form-label" for="imageFile">Replace Photo (Optional)</label>
                                    <div th:if="*{existingImagePath != null}" class="mb-2">
                                        <img th:src="@{'/uploads/' + *{existingImagePath}}" class="rounded-3 shadow-sm border me-2" style="max-height: 100px;" alt="Current Image">
                                        <small class="text-muted">Current photo displayed above.</small>
                                    </div>
                                    <input type="file" id="imageFile" th:field="*{imageFile}" class="form-control" accept="image/png, image/jpeg, image/jpg, image/webp">

                                    <div id="imagePreviewContainer" class="mt-3 text-center" style="display: none;">
                                        <img id="imagePreview" src="#" alt="New Preview" class="rounded-3 shadow-sm border" style="max-height: 180px;">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 border-top pt-4">
                                    <a th:href="@{'/items/' + ${item.id}}" class="btn btn-outline-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-save me-1"></i> Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
